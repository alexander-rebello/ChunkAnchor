name: Build check

# Compiles pull requests into master so problems show up before merging.
# Nothing is published from here - releases only happen in release.yml on master.
on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew build --no-daemon 2>&1 | tee build.log; then
            # Surface compiler errors and Gradle failures as annotations
            grep -E '^/.*\.java:[0-9]+: error:' build.log | head -n 40 | \
              sed -E "s#^$GITHUB_WORKSPACE/([^:]+):([0-9]+): error: (.*)#::error file=\1,line=\2::\3#" || true
            grep -A6 'What went wrong' build.log | head -n 20 | tr '\n' ' ' | sed 's/^/::error::/' || true
            echo
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: ChunkAnchor-pr-${{ github.event.pull_request.number }}
          path: build/libs/*.jar
