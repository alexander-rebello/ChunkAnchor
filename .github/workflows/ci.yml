name: Build check

# Compiles pull requests into master so problems show up before merging.
# Nothing is published from here - releases only happen in release.yml on master.
on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ChunkAnchor-pr-${{ github.event.pull_request.number }}
          path: build/libs/*.jar
