group=io.github.alexanderrebello
version=1.0.0

# Paper API the plugin is compiled against
paperApi=26.3.+
# api-version written into paper-plugin.yml
pluginApiVersion=26.3

# Modrinth project slug (or ID) that releases are published to
modrinthProject=chunkanchor
# Minecraft versions the Modrinth release is tagged with, comma separated.
# Each entry also matches its patch releases (26.3 -> 26.3, 26.3.1, ...).
modrinthGameVersions=26.3

org.gradle.caching=true
